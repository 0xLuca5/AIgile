services:
  litellm-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: litellm-proxy
    command:
      - --config
      - /app/litellm-config.yaml
      - --host
      - 0.0.0.0
      - --port
      - "4000"
    env_file:
      - ../settings/.env
    environment:
      GITHUB_COPILOT_TOKEN_DIR: /opt/litellm/github-copilot
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ${LITELLM_CONFIG_PATH:-../settings/litellm-config.yaml}:/app/litellm-config.yaml:ro
      - ${HERMES_DATA_DIR:-${USERPROFILE}/.hermes-dial}/litellm-copilot:/opt/litellm/github-copilot
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  copilot-login:
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - copilot-login
    command:
      - --config
      - /app/litellm-config.yaml
      - --host
      - 127.0.0.1
      - --port
      - "4000"
    env_file:
      - ../settings/.env
    environment:
      GITHUB_COPILOT_TOKEN_DIR: /opt/litellm/github-copilot
    volumes:
      - ${LITELLM_CONFIG_PATH:-../settings/litellm-config.yaml}:/app/litellm-config.yaml:ro
      - ${HERMES_DATA_DIR:-${USERPROFILE}/.hermes-dial}/litellm-copilot:/opt/litellm/github-copilot
    restart: "no"

  hermes-init:
    image: nousresearch/hermes-agent:latest
    container_name: hermes-init
    profiles:
      - hermes
    command: [python, /opt/dial/bootstrap-hermes.py]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      HERMES_DEFAULT_MODEL: ${HERMES_DEFAULT_MODEL:-dial-gpt-5}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
    depends_on:
      litellm-proxy:
        condition: service_healthy
    volumes:
      - ${HERMES_DATA_DIR:-${USERPROFILE}/.hermes-dial}:/opt/data
      - ../settings/hermes-config.yaml:/opt/dial/hermes-config.yaml:ro
      - ../prompts:/opt/dial/prompts:ro
      - ./bootstrap-hermes.py:/opt/dial/bootstrap-hermes.py:ro
    restart: "no"

  hermes:
    image: nousresearch/hermes-agent:latest
    container_name: hermes
    profiles:
      - hermes
    command: gateway run
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      WEBHOOK_ENABLED: "true"
      WEBHOOK_PORT: "8644"
      WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET}
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET}
    depends_on:
      hermes-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8642:8642"
      - "127.0.0.1:8644:8644"
      - "127.0.0.1:9119:9119"
    volumes:
      - ${HERMES_DATA_DIR:-${USERPROFILE}/.hermes-dial}:/opt/data
      - ../../../..:/workspace
      - ./skills:/opt/dial/skills:ro
    working_dir: /workspace
    shm_size: 1gb
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: hermes-tunnel
    profiles:
      - tunnel
    command: tunnel --no-autoupdate --url http://hermes:8644
    depends_on:
      hermes:
        condition: service_started
    restart: unless-stopped
