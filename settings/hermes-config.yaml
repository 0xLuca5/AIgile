# Hermes configuration source managed in this repository.
# On first initialization, deploy/bootstrap-hermes.py writes a rendered copy to
# the external HERMES_DATA_DIR. Edit routes and prompts here, then reinitialize.
_config_version: 33
model:
  provider: custom
  default: dial-gpt-5
  base_url: http://litellm-proxy:4000/v1
  api_mode: chat_completions
  api_key: __LITELLM_MASTER_KEY__

# bootstrap-hermes.py renders these values from .env. Only a password hash is
# written to the external runtime configuration.
dashboard:
  basic_auth:
    username: __HERMES_DASHBOARD_USERNAME__
    password_hash: __HERMES_DASHBOARD_PASSWORD_HASH__

# Lets webhook-triggered agent runs call kanban_create. The Kanban dispatcher
# runs inside the gateway and handles ready tasks in the default profile.
toolsets:
  - hermes-webhook
  - kanban

skills:
  external_dirs:
    - /opt/dial/skills

kanban:
  dispatch_in_gateway: true
  dispatch_interval_seconds: 60
  default_assignee: default

# GitHub request signatures use WEBHOOK_SECRET, injected from
# GITHUB_WEBHOOK_SECRET in .env. Do not put secrets in this file.
platforms:
  webhook:
    enabled: true
    extra:
      port: 8644
      routes:
        github-pr:
          events: ["pull_request"]
          prompt: |
            __GITHUB_PR_PROMPT__
          skills: ["github-code-review"]
          deliver: log

        github-issue:
          events: ["issues"]
          filters:
            - field: "action"
              in: ["opened", "reopened"]
          prompt: |
            __GITHUB_ISSUE_PROMPT__
          deliver: log
