# GitHub Copilot-only LiteLLM configuration.
# Select it with LITELLM_CONFIG_PATH=../settings/litellm-config.copilot.yaml.
model_list:
  - model_name: github-copilot-gpt-5.4
    litellm_params:
      model: github_copilot/gpt-5.4
      drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
